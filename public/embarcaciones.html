<div class="page">

  <!-- Location filter bar -->
  <div class="loc-filter-bar">
    <div class="loc-filter-inner" id="location-tabs">
      <button class="loc-btn active" data-location="">
        <span class="loc-btn-icon">🌊</span>
        <span class="loc-btn-name">Todas</span>

      <button class="loc-btn" data-location="Boca Chica">

      </button>
      <button class="loc-btn" data-location="Punta Cana">
        <span class="loc-btn-icon">🌊</span>
        <span class="loc-btn-name">Punta Cana</span>
        <span class="loc-btn-sub">República Dominicana</span>
      </button>
      <button class="loc-btn" data-location="La Romana">

      <button class="loc-btn" data-location="Miami">

  <section class="section">

      <!-- Filters -->

        <div class="filter-group">
          <label class="filter-label">Capacidad mínima</label>
          <select class="filter-select" id="filter-capacity">
            <option value="">Cualquiera</option>
            <option value="6">6+ personas</option>
            <option value="10">10+ personas</option>
            <option value="15">15+ personas</option>
            <option value="20">20+ personas</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label">Precio máximo / día</label>
          <select class="filter-select" id="filter-price">
            <option value="">Sin límite</option>
            <option value="1200">Hasta $1,200</option>
            <option value="2000">Hasta $2,000</option>
            <option value="3000">Hasta $3,000</option>
            <option value="5000">Hasta $5,000</option>
          </select>
        </div>
        <div class="filter-group" style="flex:2;min-width:200px;">
          <label class="filter-label">Buscar</label>
          <input type="text" class="filter-input" id="filter-search" placeholder="Nombre, marca, característica..." />
        </div>
        <div class="filter-group" style="justify-content:flex-end;">
          <label class="filter-label">&nbsp;</label>
          <button class="btn btn-primary filter-btn" id="btn-filter">Filtrar</button>
        </div>
      </div>

      <!-- Results count -->

        <p id="results-count" style="font-family:var(--mono);font-size:0.72rem;color:var(--text-muted);letter-spacing:0.1em;text-transform:uppercase;">Cargando...</p>

        <div class="skeleton" style="height:420px;border-radius:16px"></div>
        <div class="skeleton" style="height:420px;border-radius:16px"></div>
        <div class="skeleton" style="height:420px;border-radius:16px"></div>
        <div class="skeleton" style="height:420px;border-radius:16px"></div>
        <div class="skeleton" style="height:420px;border-radius:16px"></div>
      </div>

    </div>

<div id="toast-container"></div>
<script src="/assets/js/main.js?v=20260916b" defer></script>
<script defer>
(function () {
  let allBoats = [];
  let activeLocation = '';

  const params = new URLSearchParams(location.search);
  if (params.get('location')) activeLocation = params.get('location');

  function applyFilters() {
    const capacity = parseInt(document.getElementById('filter-capacity').value) || 0;
    const maxPrice = parseFloat(document.getElementById('filter-price').value) || Infinity;
    const search = document.getElementById('filter-search').value.toLowerCase().trim();

    let filtered = allBoats.filter(b =>
      (!activeLocation || b.location === activeLocation) &&
      b.capacity >= capacity &&
      b.price_per_day <= maxPrice &&
      (!search || b.name.toLowerCase().includes(search) || (b.description || '').toLowerCase().includes(search) || (b.short_description || '').toLowerCase().includes(search) || (b.brand || '').toLowerCase().includes(search))
    );

    filtered.sort((a,b) => (b.featured||0) - (a.featured||0));

    const count = document.getElementById('results-count');
    count.textContent = `${filtered.length} ${filtered.length !== 1 ? 'embarcaciones' : 'embarcación'} encontrada${filtered.length !== 1 ? 's' : ''}`;

    const grid = document.getElementById('boats-grid');
    if (!filtered.length) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="empty-state-icon">⛵</div><h3 class="empty-state-title">Sin resultados</h3><p class="empty-state-desc">No encontramos embarcaciones con esos filtros. Intenta ampliar la búsqueda.</p><button class="btn btn-ghost" onclick="resetFilters()">Limpiar filtros</button></div>`;
      return;
    }
    grid.innerHTML = filtered.map(window.VBR.buildBoatCard).join('');
    window.VBR.observeReveals();
  }

  window.resetFilters = function () {
    document.getElementById('filter-capacity').value = '';
    document.getElementById('filter-price').value = '';
    document.getElementById('filter-search').value = '';
    activeLocation = '';
    document.querySelectorAll('.loc-btn').forEach(t => t.classList.toggle('active', !t.dataset.location));
    applyFilters();
  };

  document.addEventListener('DOMContentLoaded', () => {
    const tabs = document.querySelectorAll('.loc-btn');
    tabs.forEach(tab => {
      if (tab.dataset.location === activeLocation) { tabs.forEach(t => t.classList.remove('active')); tab.classList.add('active'); }
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        activeLocation = tab.dataset.location;
        applyFilters();
      });
    });

    document.getElementById('btn-filter').addEventListener('click', applyFilters);
    document.getElementById('filter-search').addEventListener('keypress', e => { if (e.key === 'Enter') applyFilters(); });

    if (params.get('search')) document.getElementById('filter-search').value = params.get('search');

    fetch('/api/boats').then(r => r.json()).then(boats => {
      allBoats = boats;
      applyFilters();
    });
  });
})();
</script>
